
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #E24B4A;
    --accent2: #378ADD;
    --bg: var(--color-background-primary);
    --bg2: var(--color-background-secondary);
    --bg3: var(--color-background-tertiary);
    --text: var(--color-text-primary);
    --text2: var(--color-text-secondary);
    --border: var(--color-border-tertiary);
  }
  body { font-family: 'DM Sans', sans-serif; background: transparent; color: var(--text); }
  #app { padding: 0 0 2rem; }

  /* HEADER */
  .catalog-header { padding: 1.5rem 0 1rem; border-bottom: 0.5px solid var(--border); margin-bottom: 1.5rem; }
  .catalog-header h1 { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .catalog-header p { font-size: 13px; color: var(--text2); margin-top: 4px; }

  /* FILTER TABS */
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .filter-btn { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 20px; border: 0.5px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; transition: all 0.15s; }
  .filter-btn:hover { background: var(--bg2); color: var(--text); }
  .filter-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* CATEGORY SECTION */
  .cat-section { margin-bottom: 2rem; }
  .cat-label { display: flex; align-items: center; gap: 10px; margin-bottom: 0.75rem; }
  .cat-label h2 { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 600; }
  .cat-count { font-size: 11px; color: var(--text2); background: var(--bg2); border: 0.5px solid var(--border); border-radius: 20px; padding: 2px 8px; }
  .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-Cars { background: #E24B4A; }
  .dot-Bikes { background: #378ADD; }
  .dot-Phones { background: #1D9E75; }
  .dot-Computers { background: #EF9F27; }

  /* ITEM GRID */
  .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .item-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--border-radius-lg); overflow: hidden; cursor: pointer; transition: border-color 0.15s, transform 0.15s; }
  .item-card:hover { border-color: var(--color-border-secondary); transform: translateY(-2px); }
  .item-card-img { width: 100%; height: 110px; object-fit: cover; object-position: center; display: block; background: var(--bg2); }
  .item-card-body { padding: 10px 12px; }
  .item-card-name { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
  .item-card-tag { font-size: 11px; color: var(--text2); }
  .item-card-props { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  .prop-pill { font-size: 10px; padding: 2px 7px; border-radius: 10px; border: 0.5px solid var(--border); color: var(--text2); background: var(--bg2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

  /* DETAIL VIEW */
  #detail-view { display: none; }
  .back-btn { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; background: transparent; border: 0.5px solid var(--border); padding: 6px 14px; border-radius: 20px; cursor: pointer; color: var(--text2); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 6px; }
  .back-btn:hover { background: var(--bg2); color: var(--text); }
  .detail-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--border-radius-lg); overflow: hidden; }
  .detail-hero { width: 100%; height: 240px; object-fit: cover; display: block; background: var(--bg2); }
  .detail-body { padding: 1.25rem; }
  .detail-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 0.5rem; }
  .detail-cat-badge { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; }
  .badge-Cars { background: #FCEBEB; color: #A32D2D; border: 0.5px solid #F7C1C1; }
  .badge-Bikes { background: #E6F1FB; color: #185FA5; border: 0.5px solid #B5D4F4; }
  .badge-Phones { background: #E1F5EE; color: #0F6E56; border: 0.5px solid #9FE1CB; }
  .badge-Computers { background: #FAEEDA; color: #854F0B; border: 0.5px solid #FAC775; }
  .detail-name { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 1rem; }
  .detail-props { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .prop-card { background: var(--bg2); border-radius: var(--border-radius-md); padding: 10px 12px; border: 0.5px solid var(--border); }
  .prop-card-label { font-size: 11px; color: var(--text2); margin-bottom: 3px; }
  .prop-card-value { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600; }

  .section-divider { height: 0.5px; background: var(--border); margin: 1.5rem 0; }
</style>

<div id="app">
  <div id="home-view">
    <div class="catalog-header">
      <h1>Product Catalog</h1>
      <p>Browse items across categories</p>
    </div>
    <div class="filter-bar" id="filter-bar"></div>
    <div id="catalog-content"></div>
  </div>

  <div id="detail-view">
    <button class="back-btn" onclick="showHome()">&#8592; Back to catalog</button>
    <div class="detail-card">
      <img id="d-img" class="detail-hero" src="" alt="" />
      <div class="detail-body">
        <div class="detail-meta">
          <span id="d-badge" class="detail-cat-badge"></span>
        </div>
        <div id="d-name" class="detail-name"></div>
        <div id="d-props" class="detail-props"></div>
      </div>
    </div>
  </div>
</div>

const categories = [...new Set(data.map(d => d.category))];
let activeFilter = 'All';

function renderFilterBar() {
  const bar = document.getElementById('filter-bar');
  const allFilters = ['All', ...categories];
  bar.innerHTML = allFilters.map(f =>
    `<button class="filter-btn ${f === activeFilter ? 'active' : ''}" onclick="setFilter('${f}')">${f} <span style="opacity:0.6;font-size:11px;">${f==='All'?data.length:data.filter(d=>d.category===f).length}</span></button>`
  ).join('');
}

function setFilter(f) {
  activeFilter = f;
  renderFilterBar();
  renderCatalog();
}

function renderCatalog() {
  const content = document.getElementById('catalog-content');
  const filtered = activeFilter === 'All' ? data : data.filter(d => d.category === activeFilter);
  const cats = activeFilter === 'All' ? categories : [activeFilter];

  content.innerHTML = cats.map(cat => {
    const items = filtered.filter(d => d.category === cat);
    if (!items.length) return '';
    return `
      <div class="cat-section">
        <div class="cat-label">
          <span class="cat-dot dot-${cat}"></span>
          <h2>${cat}</h2>
          <span class="cat-count">${items.length} items</span>
        </div>
        <div class="item-grid">
          ${items.map((item, i) => `
            <div class="item-card" onclick="showDetail(${data.indexOf(item)})">
              <img class="item-card-img" src="${item.image}" alt="${item.itemname}" onerror="this.style.background='var(--bg2)';this.src=''" />
              <div class="item-card-body">
                <div class="item-card-name">${item.itemname}</div>
                <div class="item-card-tag">${item.category}</div>
                <div class="item-card-props">
                  ${item.itemprops.slice(0,2).map(p => `<span class="prop-pill">${p.label}: ${p.value}</span>`).join('')}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
        ${cats.indexOf(cat) < cats.length - 1 ? '<div class="section-divider"></div>' : ''}
      </div>
    `;
  }).join('');
}

function showDetail(idx) {
  const item = data[idx];
  document.getElementById('home-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
  document.getElementById('d-img').src = item.image;
  document.getElementById('d-img').alt = item.itemname;
  document.getElementById('d-name').textContent = item.itemname;
  const badge = document.getElementById('d-badge');
  badge.textContent = item.category;
  badge.className = `detail-cat-badge badge-${item.category}`;
  document.getElementById('d-props').innerHTML = item.itemprops.map(p => `
    <div class="prop-card">
      <div class="prop-card-label">${p.label}</div>
      <div class="prop-card-value">${p.value}</div>
    </div>
  `).join('');
  window.scrollTo(0, 0);
}

function showHome() {
  document.getElementById('home-view').style.display = 'block';
  document.getElementById('detail-view').style.display = 'none';
}

renderFilterBar();
renderCatalog();
</script>
